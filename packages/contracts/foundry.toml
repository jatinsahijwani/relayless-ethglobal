[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules"]
auto_detect_remappings = false
allow_paths = ["../../node_modules"]
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
  "lean-imt/=node_modules/lean-imt/",
  "poseidon-solidity/=node_modules/poseidon-solidity/",
  "forge-std/=node_modules/forge-std/src/",
]
