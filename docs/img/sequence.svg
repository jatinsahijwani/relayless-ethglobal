<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-label="Sequence of a payment: the browser proves and simulates, sends a frame transaction to the alt mempool, the pool verifies and approves, then pays the fresh wallet and refunds it." font-family="Helvetica, Arial, sans-serif">
  <defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#16233A"/></marker></defs>
  <rect width="960" height="560" fill="#F6F8F6"/>
  <g font-size="15" font-weight="700" text-anchor="middle" fill="#F6F8F6">
    <rect x="40" y="24" width="180" height="44" rx="8" fill="#16233A"/><text x="130" y="52">Your browser</text>
    <rect x="280" y="24" width="180" height="44" rx="8" fill="#56667A"/><text x="370" y="52">Alt mempool</text>
    <rect x="520" y="24" width="180" height="44" rx="8" fill="#0B6B70"/><text x="610" y="52">Pool (sender, payer)</text>
    <rect x="740" y="24" width="180" height="44" rx="8" fill="#F0A202"/><text x="830" y="52" fill="#16233A">Fresh wallet: 0 ETH</text>
  </g>
  <g stroke="#C9D3CF" stroke-width="2"><line x1="130" y1="68" x2="130" y2="536"/><line x1="370" y1="68" x2="370" y2="536"/><line x1="610" y1="68" x2="610" y2="536"/><line x1="830" y1="68" x2="830" y2="536"/></g>
  <g font-size="14" fill="#16233A">
    <rect x="36" y="90" width="188" height="50" rx="6" fill="#FFFFFF" stroke="#16233A"/>
    <text x="130" y="111" text-anchor="middle" font-weight="700">Prove the note is yours</text><text x="130" y="130" text-anchor="middle">about 2 s, on your device</text>
    <rect x="36" y="152" width="188" height="50" rx="6" fill="#FFFFFF" stroke="#16233A"/>
    <text x="130" y="173" text-anchor="middle" font-weight="700">Simulate first</text><text x="130" y="192" text-anchor="middle">a failing tx is never sent</text>

    <line x1="130" y1="236" x2="368" y2="236" stroke="#16233A" stroke-width="2" marker-end="url(#a)"/>
    <text x="250" y="226" text-anchor="middle" font-weight="700">Frame transaction</text>
    <text x="490" y="240" text-anchor="middle" fill="#56667A">Checks stake, budget, rules: 17 of 17</text>

    <line x1="370" y1="292" x2="608" y2="292" stroke="#16233A" stroke-width="2" marker-end="url(#a)"/>
    <text x="490" y="270" text-anchor="middle" font-weight="700">Frame 0, VERIFY</text>
    <text x="490" y="284" text-anchor="middle" font-size="12">check proof, APPROVE, consume nullifier</text>
    <text x="490" y="316" text-anchor="middle" fill="#0B6B70" font-weight="700">About 253k gas. Reads no storage.</text>

    <line x1="610" y1="372" x2="828" y2="372" stroke="#16233A" stroke-width="2" marker-end="url(#a)"/>
    <text x="720" y="346" text-anchor="middle" font-weight="700">Frame 1, SENDER</text>
    <text x="720" y="362" text-anchor="middle" font-size="12">pay, add change note, publish root</text>

    <line x1="610" y1="432" x2="828" y2="432" stroke="#16233A" stroke-width="2" marker-end="url(#a)"/>
    <text x="720" y="406" text-anchor="middle" font-weight="700">Frame 2, DEFAULT</text>
    <text x="720" y="422" text-anchor="middle" font-size="13">refund unused fee</text>

    <rect x="622" y="462" width="298" height="58" rx="6" fill="#FFFFFF" stroke="#F0A202" stroke-width="2"/>
    <text x="771" y="486" text-anchor="middle" font-weight="700">The wallet now holds the money.</text>
    <text x="771" y="506" text-anchor="middle">Nobody funded it. There was no relayer.</text>
  </g>
</svg>
